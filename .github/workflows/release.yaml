env:
  DIRECTORY: dist
  PROJECT_NAME: fukidashi

name: Release

on:
  push:
    branches: ["main"]
  # Manual runs pick a single store, so a failed or late submission can be
  # retried on its own without touching the other one.
  workflow_dispatch:
    inputs:
      target:
        description: "Store to release to"
        type: choice
        options:
          - both
          - chrome
          - firefox
        default: both

jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.plan.outputs.should_release }}
      release_chrome: ${{ steps.plan.outputs.release_chrome }}
      release_firefox: ${{ steps.plan.outputs.release_firefox }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Plan release
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target || 'both' }}
        run: |
          # A manual run is the release; a push only releases when package.json moved.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHOULD_RELEASE=1
          elif git diff --name-only HEAD~1..HEAD | grep -q '^package\.json$'; then
            SHOULD_RELEASE=1
          else
            SHOULD_RELEASE=0
          fi
          case "$TARGET" in
            chrome) RELEASE_CHROME=1; RELEASE_FIREFOX=0 ;;
            firefox) RELEASE_CHROME=0; RELEASE_FIREFOX=1 ;;
            *) RELEASE_CHROME=1; RELEASE_FIREFOX=1 ;;
          esac
          {
            echo "should_release=$SHOULD_RELEASE"
            echo "release_chrome=$RELEASE_CHROME"
            echo "release_firefox=$RELEASE_FIREFOX"
          } >> "$GITHUB_OUTPUT"
      - name: Get version
        if: ${{ steps.plan.outputs.should_release == '1' }}
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  Submit:
    permissions:
      id-token: write # required for Workload Identity
      contents: write
    needs: Version
    if: ${{ needs.Version.outputs.should_release == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      # The OAuth client the Drive sync signs in with is baked in at build
      # time. It is a repository variable, not a secret: the id is public.
      - name: Zip Chrome extension
        if: ${{ needs.Version.outputs.release_chrome == '1' }}
        run: pnpm run zip
        env:
          WXT_GOOGLE_CLIENT_ID: ${{ vars.WXT_GOOGLE_CLIENT_ID }}
      - name: Zip Firefox extension
        if: ${{ needs.Version.outputs.release_firefox == '1' }}
        run: pnpm run zip:firefox
        env:
          WXT_GOOGLE_CLIENT_ID: ${{ vars.WXT_GOOGLE_CLIENT_ID }}
      - name: Submit to the Chrome Web Store
        if: ${{ needs.Version.outputs.release_chrome == '1' }}
        run: |
          pnpm wxt submit \
            --chrome-zip ${{ env.DIRECTORY }}/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      - name: Submit to the Firefox Add-on Store
        if: ${{ needs.Version.outputs.release_firefox == '1' }}
        run: |
          pnpm wxt submit \
            --firefox-zip ${{ env.DIRECTORY }}/*-firefox.zip \
            --firefox-sources-zip ${{ env.DIRECTORY }}/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      - name: Collect release assets
        id: assets
        env:
          VERSION: ${{ needs.Version.outputs.version }}
        run: |
          # Only the zips this run actually built — the rest were never created.
          {
            echo "files<<EOF"
            if [ "${{ needs.Version.outputs.release_chrome }}" = "1" ]; then
              echo "$DIRECTORY/$PROJECT_NAME-$VERSION-chrome.zip"
            fi
            if [ "${{ needs.Version.outputs.release_firefox }}" = "1" ]; then
              echo "$DIRECTORY/$PROJECT_NAME-$VERSION-firefox.zip"
              echo "$DIRECTORY/$PROJECT_NAME-$VERSION-sources.zip"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.Version.outputs.version }}"
          name: "v${{ needs.Version.outputs.version }}"
          # Without this the release is published with no description at all,
          # and the page falls back to the message of the commit that tagged
          # it — always the version bump, which names nothing that shipped.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ${{ steps.assets.outputs.files }}
